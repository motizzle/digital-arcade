<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Connect 4</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
<link rel="apple-touch-icon" href="https://motisorkin.com/apple-touch-icon.png" />
<meta property="og:site_name" content="Moti Sorkin" />
<meta property="og:title" content="Connect 4 — Moti Sorkin" />
<style>
/* ============================================================================
   Fractal Game Shell — shared chrome.
   Theme, header, control bar, and the 3-layer canvas stack. Game-agnostic:
   nothing here knows about pong, checkers, or any specific board.
   ========================================================================== */
:root {
  --bg: #0a0a14; --bg2: #14141f;
  --fg: #e8e8f0; --muted: #888;
  --accent: #ff7a2c; --accent2: #2cb1ff;
  --line: #303045;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  width: 100%;
  height: 100dvh; max-height: 100dvh;
  background: radial-gradient(ellipse at 50% -20%, #1a1a2e 0%, var(--bg) 60%);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  position: fixed;
  inset: 0;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
/* Buttons/links/inputs still get normal taps under a locked stage. */
a, button, input, textarea, select, label {
  touch-action: manipulation;
}
/* Shell root: column flex so the play area shrinks to whatever chrome is left. */
#app {
  display: flex; flex-direction: column;
  height: 100%; min-height: 0;
}

/* Back-to-arcade link (top-left). Same host serves the hub at "/". */
.arcade-back {
  position: fixed; top: 14px; left: 14px; z-index: 60;
  font-size: 13px; line-height: 1; text-decoration: none;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; background: rgba(20, 20, 31, 0.7);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  transition: color 120ms, border-color 120ms;
}
.arcade-back:hover { color: var(--fg); border-color: #6c8cff; }

header {
  flex-shrink: 0;
  padding: 12px 20px 2px;
  text-align: center;
}
header h1 {
  margin: 0; font-weight: 300; font-size: clamp(22px, 3.4vw, 32px); letter-spacing: 0.04em;
  background: linear-gradient(90deg, #ff7a2c, #ff3ca6, #2cb1ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; letter-spacing: 0.06em; }

main {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 16px 8px;
  overflow: hidden;
}

#controls {
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  margin: 8px 0; padding: 8px 12px;
  background: rgba(20, 20, 31, 0.6);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(8px);
}
#controls button {
  background: linear-gradient(180deg, #2a2a3f, #1a1a2a);
  color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit;
  transition: border-color 0.12s, color 0.12s;
}
#controls button:hover { border-color: var(--accent); color: var(--accent); }

/* Segmented mode switch (1 Player / 2 Players / …). */
.seg {
  display: inline-flex; gap: 2px; padding: 3px;
  background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 8px;
}
.seg button {
  background: transparent; border: none; color: var(--muted);
  padding: 6px 14px; font-size: 13px; cursor: pointer; border-radius: 6px;
  font-family: inherit; letter-spacing: 0.03em;
}
.seg button.active {
  background: linear-gradient(180deg, #2a2a3f, #1a1a2a);
  color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
}
#controls button.active {
  border-color: var(--accent);
  color: var(--accent);
}
.seg button:hover:not(.active) { color: var(--fg); }

/* The stage holds the editable name bar + the canvas. It grows/shrinks so the
   board always fits the visible viewport (no page scroll). */
.stage {
  --aspect: 1.6;
  --stage-max: 1200px;
  flex: 1; min-height: 0;
  width: 100%;
  max-width: min(96vw, var(--stage-max));
  margin: 0 auto;
  display: flex; flex-direction: column; align-items: center;
}

/* Editable player-name bar above the board. */
#playerNames {
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; margin-bottom: 6px;
  width: 100%;
}
#playerNames input {
  flex: 0 1 46%; min-width: 0;
  background: rgba(20, 20, 31, 0.6);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px;
  font-family: inherit; font-size: 15px; font-weight: 300; letter-spacing: 0.02em;
  color: var(--fg); outline: none;
}
#playerNames input.right { text-align: right; }
#playerNames input:focus { box-shadow: inset 0 0 0 1px currentColor; }
/* Defaults ("Computer", "Player 2", …) show as dimmed placeholders in the
   seat's team color; anything typed renders at full strength. */
#playerNames input::placeholder { color: currentColor; opacity: 0.55; }

/* Underline-only name fields (no boxed border). */
#playerNames.name-underline input {
  background: transparent;
  border: none;
  border-radius: 0;
  border-bottom: 1px solid currentColor;
  padding: 4px 2px 6px;
}
#playerNames.name-underline input:focus {
  box-shadow: none;
  border-bottom-width: 2px;
}

#canvasWrap {
  position: relative;
  flex: 1; min-height: 0;
  aspect-ratio: var(--aspect);
  width: min(100%, calc(100% * var(--aspect)));
  max-width: min(96vw, var(--stage-max));
  max-height: 100%;
  height: auto;
  border-radius: 12px;
  overflow: hidden;
  /* Lighter, clearly visible border so the play-area edges read against the
     dark page. Inset highlight crisps the inner boundary; the colored glow
     stays for ambiance. */
  border: 1.5px solid rgba(190, 200, 230, 0.55);
  box-shadow: 0 0 60px rgba(255, 122, 44, 0.08), 0 0 100px rgba(44, 177, 255, 0.06),
              inset 0 0 0 1px rgba(190, 200, 230, 0.12);
  background: #04040a;
  touch-action: none;
}
#bgCanvas, #glCanvas, #uiCanvas {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
}
#bgCanvas { z-index: 0; }
#glCanvas { z-index: 1; }
#uiCanvas { z-index: 2; pointer-events: auto; }

/* Fullscreen toggle — lives in #controls next to New Game / Theme. */
#controls .fs-btn {
  padding: 8px 12px;
  font-size: 16px; line-height: 1;
  min-width: 42px;
}

/* Native fullscreen: the wrap becomes the whole screen — drop the aspect lock,
   rounded corners and border so the court fills the display edge to edge. */
#canvasWrap:fullscreen,
#canvasWrap:-webkit-full-screen {
  width: 100vw; height: 100vh; max-width: none;
  aspect-ratio: auto; border-radius: 0; border: none;
}
/* iOS Safari has no element fullscreen — a CSS class covers the viewport. */
#canvasWrap.pseudo-fs {
  position: fixed; inset: 0; z-index: 9000;
  width: 100vw; height: 100dvh; max-width: none;
  aspect-ratio: auto; border-radius: 0; border: none;
}

.hint {
  flex-shrink: 0;
  color: var(--muted); font-size: 11px; margin-top: 4px; letter-spacing: 0.04em; text-align: center;
}

/* ---- High-score initials prompt (shown over the play area on game end) ---- */
.hs-overlay {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  /* No backdrop-filter here: under software compositing (the kiosk) the
     backdrop re-blurs on every typing repaint, lagging the very input this
     dialog exists for. The dark wash carries the dimming on its own. */
  background: rgba(4, 4, 10, 0.78);
}
/* Sized for comfortable touch entry on a kiosk/tablet — kids shouldn't have
   to hit a tiny target. Matched by index.html's .name-card (same padding/
   radius/input-and-button scale) so the arcade-wide name picker and this
   end-of-game prompt read as the same kind of dialog. */
.hs-card {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 36px 40px; border-radius: 20px;
  min-width: 300px; max-width: 90vw;
  background: rgba(16, 16, 26, 0.94); border: 1px solid rgba(190, 200, 230, 0.35);
  box-shadow: 0 12px 44px rgba(0, 0, 0, 0.55);
  font-family: -apple-system, system-ui, sans-serif; text-align: center;
}
.hs-title { font-size: 18px; letter-spacing: 0.22em; color: #ffd07a; font-weight: 600; }
.hs-score { font-size: 42px; font-weight: 300; color: #e8e8f0; letter-spacing: 0.04em; }
.hs-form { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.hs-initials {
  width: 5.5em; text-align: center; text-transform: uppercase;
  font-size: 40px; letter-spacing: 0.28em; font-weight: 600;
  padding: 14px 12px; min-height: 64px; box-sizing: border-box;
  color: #fff; background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(190, 200, 230, 0.4); border-radius: 12px; outline: none;
}
.hs-initials::placeholder { color: rgba(232, 232, 240, 0.35); }
.hs-initials:focus { border-color: #ffd07a; box-shadow: inset 0 0 0 1px #ffd07a; }
/* Full-name variant (12 chars) — used when an arcade identity is in play and
   by the "who's playing?" prompt. Wider, slightly smaller type so a whole
   name fits without scrolling inside the field. */
.hs-initials.hs-name {
  width: 10em; max-width: 76vw;
  font-size: 28px; letter-spacing: 0.12em;
}
.hs-save {
  font-family: inherit; font-size: 20px; font-weight: 600; cursor: pointer;
  color: #06060c; background: linear-gradient(180deg, #ffd07a, #ff9d2c);
  border: none; border-radius: 12px; padding: 16px 28px; min-height: 56px; box-sizing: border-box;
}
.hs-skip {
  background: none; border: none; color: var(--muted); font-family: inherit;
  font-size: 15px; cursor: pointer; text-decoration: underline; padding: 8px;
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================================
   Arcade High Scores
   ----------------------------------------------------------------------------
   A tiny, DOM-agnostic high-score store shared by the hub and every game.

   Two layers, both pure-ish and unit-tested (see highscores.test.js):
     - ranking logic   : qualifies() / rankInsert() / sortTrim()  (no I/O)
     - persistence      : load() / save() / submit() / top()       (Storage)

   Scores live in localStorage under `arcade.hs.<gameId>` as a JSON array of
   { name, score, ts }. `order` is 'desc' (higher is better, default) or 'asc'
   (lower is better). The board is capped to MAX (top ten — classic arcade).

   Runs in the browser (window.HighScores) and Node (module.exports) so the
   ranking logic can be tested without a DOM. Storage is injectable, so tests
   pass an in-memory stub instead of localStorage.
   ========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.HighScores = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const MAX = 10;                 // top ten
  const PREFIX = 'arcade.hs.';
  const PLAYER_KEY = 'arcade.player';        // the identity picked this session
  const LAST_PLAYER_KEY = 'arcade.player.last';  // previous answer, prompt prefill only

  function cmp(order) {
    // Sort so the BEST score is first. 'asc' => smaller is better.
    return (order === 'asc') ? (a, b) => a - b : (a, b) => b - a;
  }

  // Sort a list best-first and trim to `max`. Ties broken by earliest ts
  // (the older record keeps the higher rank — first to get there wins).
  function sortTrim(list, order, max) {
    if (max == null) max = MAX;
    const c = cmp(order);
    const out = (list || []).slice().sort(
      (a, b) => c(a.score, b.score) || ((a.ts || 0) - (b.ts || 0))
    );
    return out.slice(0, max);
  }

  // Would `score` earn a spot on the board?
  function qualifies(list, score, order, max) {
    order = order || 'desc';
    if (max == null) max = MAX;
    if (typeof score !== 'number' || !isFinite(score)) return false;
    const board = sortTrim(list, order, max);
    if (board.length < max) return true;
    const worst = board[board.length - 1];
    return (order === 'asc') ? (score < worst.score) : (score > worst.score);
  }

  // Insert `entry` and re-rank. Returns { list, rank }; rank is the 0-based
  // position of `entry` on the trimmed board, or -1 if it didn't make it.
  function rankInsert(list, entry, order, max) {
    order = order || 'desc';
    if (max == null) max = MAX;
    const merged = sortTrim((list || []).concat([entry]), order, max);
    return { list: merged, rank: merged.indexOf(entry) };
  }

  // ---- persistence ---------------------------------------------------------
  function defaultStorage() {
    try { if (typeof localStorage !== 'undefined') return localStorage; } catch (e) {}
    return null;
  }
  function key(gameId) { return PREFIX + gameId; }

  function load(gameId, storage) {
    storage = storage || defaultStorage();
    if (!storage) return [];
    try {
      const raw = storage.getItem(key(gameId));
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr)
        ? arr.filter((e) => e && typeof e.score === 'number' && isFinite(e.score))
        : [];
    } catch (e) { return []; }
  }

  function save(gameId, list, storage) {
    storage = storage || defaultStorage();
    if (!storage) return;
    try { storage.setItem(key(gameId), JSON.stringify(list)); } catch (e) {}
  }

  // Normalize a name to the arcade shape: A–Z0–9, capped to maxLen (default 3,
  // the classic initials length; win-tally boards pass a longer maxLen so real
  // player names like MOTI / ADA survive).
  function sanitizeName(name, maxLen) {
    if (maxLen == null) maxLen = 3;
    const s = String(name == null ? '' : name).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, maxLen);
    return s || 'AAA';
  }

  function now() { try { return Date.now(); } catch (e) { return 0; } }

  // Record a score. Returns { list, rank, entry } — rank -1 means off the board
  // (still saved to nothing; the caller usually checks qualifies() first).
  function submit(gameId, name, score, opts) {
    opts = opts || {};
    const order = opts.order || 'desc';
    const max = (opts.max == null) ? MAX : opts.max;
    const storage = opts.storage;
    const ts = (opts.ts == null) ? now() : opts.ts;
    const entry = { name: sanitizeName(name, opts.maxLen), score: score, ts: ts };
    const { list, rank } = rankInsert(load(gameId, storage), entry, order, max);
    save(gameId, list, storage);
    return { list: list, rank: rank, entry: entry };
  }

  // Cumulative tally: add `delta` (default 1) to the named player's running
  // total for a game, keyed by name (one row per player). Used by win-based
  // games (tic-tac-toe, Connect 4) where the "high score" is total wins.
  function bump(gameId, name, delta, opts) {
    opts = opts || {};
    const storage = opts.storage;
    const order = opts.order || 'desc';
    const max = (opts.max == null) ? MAX : opts.max;
    const inc = (delta == null) ? 1 : delta;
    const nm = sanitizeName(name, opts.maxLen == null ? 12 : opts.maxLen);
    const list = load(gameId, storage);
    let entry = null;
    for (let i = 0; i < list.length; i++) { if (list[i].name === nm) { entry = list[i]; break; } }
    if (entry) entry.score += inc;
    else list.push({ name: nm, score: inc, ts: (opts.ts == null ? now() : opts.ts) });
    const trimmed = sortTrim(list, order, max);
    save(gameId, trimmed, storage);
    return trimmed;
  }

  // ---- shared player identity ----------------------------------------------
  // "Who's playing?" is asked once per browser SESSION. The answer lives in
  // sessionStorage: it survives navigating between the hub and the games
  // (same-tab page loads share it) but a fresh visit asks again — kids swap
  // chairs between visits. The most recent answer is also kept in
  // localStorage, purely as a prompt prefill, never as an identity.
  function defaultSession() {
    try { if (typeof sessionStorage !== 'undefined') return sessionStorage; } catch (e) {}
    return null;
  }

  function readName(storage, k) {
    if (!storage) return '';
    try {
      const raw = storage.getItem(k);
      if (!raw) return '';                       // unset — don't fabricate 'AAA'
      return String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
    } catch (e) { return ''; }
  }

  function player(storage) {
    return readName(storage || defaultSession(), PLAYER_KEY);
  }

  // The previous session's name — offered as a prefill in name prompts.
  function lastPlayer(storage) {
    return readName(storage || defaultStorage(), LAST_PLAYER_KEY);
  }

  function setPlayer(name, storage) {
    storage = storage || defaultSession();
    const nm = sanitizeName(name, 12);
    if (storage) { try { storage.setItem(PLAYER_KEY, nm); } catch (e) {} }
    const last = defaultStorage();
    if (last) { try { last.setItem(LAST_PLAYER_KEY, nm); } catch (e) {} }
    return nm;
  }

  function top(gameId, n, opts) {
    opts = opts || {};
    const board = sortTrim(load(gameId, opts.storage), opts.order || 'desc', opts.max || MAX);
    return (n != null) ? board.slice(0, n) : board;
  }

  function clear(gameId, storage) {
    storage = storage || defaultStorage();
    if (storage) { try { storage.removeItem(key(gameId)); } catch (e) {} }
  }

  return {
    MAX, PREFIX, PLAYER_KEY, LAST_PLAYER_KEY,
    cmp, sortTrim, qualifies, rankInsert, sanitizeName,
    key, load, save, submit, bump, top, clear,
    player, setPlayer, lastPlayer,
  };
});

</script>
<script>
/* ============================================================================
   Fractal Game Shell
   ----------------------------------------------------------------------------
   A reusable engine for games whose "pieces" are fractal-textured 3D spheres
   (Mandelbrot / Julia / Newton). Lifted from the Fractal Checkers engine.

   The shell owns everything generic:
     - the 3-layer canvas stack (bg 2D / WebGL spheres / ui 2D)
     - DOM chrome (header, control bar, mode switch, theme switch)
     - the WebGL fractal-sphere renderer (verbatim shader from checkers)
     - DPR / resize, reduced-motion handling, the animation loop
     - input plumbing (pointer + keyboard) forwarded to the game
     - favicon bake

   A GAME is a plain object implementing the interface documented in README.md:
     id, title, subtitle?, aspect?, modes[], controls[],
     reset(shell), resize(shell,w,h), update(shell,dt),
     drawBackground(shell,ctx,w,h), drawForeground(shell,ctx,w,h),
     spheres()  -> [{x,y,r,tint,look,seed,hover,zoom,frozen,capture}],
     onPointerMove/Down/Up(shell,x,y), onKeyDown/Up(shell,e)

   The game works entirely in CSS pixels. The shell handles DPR scaling and the
   WebGL y-flip when it uploads spheres to the GPU.
   ========================================================================== */
(function () {
  'use strict';

  // ---- Fractal type / coloring / trap / palette enums (verbatim, checkers:362) -
  const F_JULIA = 0, F_NEWTON3 = 1, F_NEWTON4 = 2, F_BURNINGSHIP = 3,
        F_MANDELBROT = 4, F_PHOENIX = 5, F_NOVA = 6;
  const C_ESCAPE = 0, C_TRAP = 1, C_TRAP_ESCAPE = 2, C_DE_GLOW = 3,
        C_NORMAL_3D = 4, C_NEWTON_BAS = 5, C_BANDS = 6, C_PICKOVER = 7;
  const T_POINT = 0, T_CIRCLE = 1, T_PICKOVER = 2;
  const PAL_WARM = 0, PAL_COOL = 1, PAL_ACID = 2;

  const MAX_DPR = 2;
  const FORCED_SSAA = 1;
  // Pixel budget for the fractal (WebGL) layer. Its shader cost is per-pixel
  // (up to 320 iterations each, ×4 with SSAA), so the backing store is capped
  // at ~720p and CSS-scaled up: fullscreen on a large display renders the
  // spheres at the same cost as a windowed board instead of shading 2–8M
  // pixels a frame (which made fullscreen unplayably slow). The 2D bg/ui
  // layers keep full DPR so text and lines stay crisp (until lowPerf latches —
  // then every layer shares the capped scale).
  const GL_MAX_PIXELS = 1280 * 720;
  // Don't cap a board that's only slightly over budget: a fractional
  // downscale forces the compositor to RESAMPLE the layer every frame
  // (expensive under software compositing — the kiosk) for almost no shader
  // savings. Serpent's 96vmin board on a 1080p screen is 1.17× budget; the
  // first cut of this cap resampled it every frame and made the game SLOWER
  // windowed than before the cap existed.
  const GL_BUDGET_TOLERANCE = 1.35;
  const MAX_PIECES = 64;        // shell supports many spheres (checkers); pong uses 1

  // ---- Built-in fractal "looks" a game can choose per sphere (checkers:382) ----
  // A game references these by key (e.g. sphere.look = 'bands').
  const PRESETS = {
    // Mandelbrot, banded coloring — flowing concentric bands.
    bands: {
      fractal: F_MANDELBROT, coloring: C_BANDS, palette: PAL_COOL,
      p: { zoomCx: -0.745, zoomCy: 0.113, zoomScale: 0.012, trapScale: 4.0, maxIter: 320 },
    },
    // Julia, Pickover-stalk coloring — luminous filaments on a tinted glow.
    stalks: {
      fractal: F_JULIA, coloring: C_PICKOVER, palette: PAL_ACID,
      p: { jCx: -0.4, jCy: 0.6, trapShape: T_PICKOVER, trapScale: 5.0, viewScale: 0.55, maxIter: 180 },
    },
    // Newton/Nova basins — kaleidoscopic root-coloring.
    nova: {
      fractal: F_NOVA, coloring: C_NEWTON_BAS, palette: PAL_ACID,
      p: { maxIter: 64, relax: 1.0 },
    },
  };

  const THEME_NAMES = ['Fire / Ice', 'Acid / Violet'];

  // ---- Shaders (verbatim from checkers.html:1256-1768) -------------------------
  const VERT_SRC = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = (aPos + 1.0) * 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

  const FRAG_SRC = `
#extension GL_OES_standard_derivatives : enable
#ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
#else
  precision mediump float;
#endif

varying vec2 vUv;
uniform vec2 uResolution;
uniform float uTime;
uniform int uPieceCount;
uniform vec4 uPiecesA[${MAX_PIECES}];
uniform vec4 uPiecesB[${MAX_PIECES}];
uniform float uPieceFrozen[${MAX_PIECES}];
uniform float uPieceSeedId[${MAX_PIECES}];

uniform int uFractalType;
uniform int uColoring;
uniform int uPalette;
uniform float uMaxIter;
uniform vec2 uJuliaC;
uniform vec2 uZoomCenter;
uniform float uZoomScale;
uniform int uTrapShape;
uniform vec2 uTrapPos;
uniform float uTrapScale;
uniform float uTrapRadius;
uniform float uRelax;
uniform int uSSAA;
uniform float uViewScale;
uniform int uTheme;

const float BAILOUT2 = 65536.0;
const int  MAX_ITER_HARD = 320;

vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
  return a + b * cos(6.2831853 * (c * t + d));
}
vec3 paletteWarm(float t) { return palette(t, vec3(0.55,0.42,0.30), vec3(0.40,0.38,0.30), vec3(1.00,1.00,0.55), vec3(0.0,0.20,0.50)); }
vec3 paletteCool(float t) { return palette(t, vec3(0.50,0.50,0.50), vec3(0.50,0.50,0.50), vec3(1.00,1.00,1.00), vec3(0.0,0.33,0.67)); }
vec3 paletteAcid(float t) { return palette(t, vec3(0.50,0.50,0.50), vec3(0.45,0.40,0.42), vec3(1.40,0.80,0.20), vec3(0.50,0.20,0.25)); }

vec3 teamPalette(float t, float playerTint) {
  vec3 a, b, c, d;
  if (uTheme == 0) {
    if (playerTint > 0.0) {
      a = vec3(0.55, 0.08, 0.05); b = vec3(1.00, 0.40, 0.05);
      c = vec3(1.00, 0.85, 0.20); d = vec3(1.00, 0.65, 0.45);
    } else {
      a = vec3(0.02, 0.12, 0.45); b = vec3(0.10, 0.55, 1.00);
      c = vec3(0.20, 0.92, 1.00); d = vec3(0.50, 0.30, 1.00);
    }
  } else if (uTheme == 1) {
    if (playerTint > 0.0) {
      a = vec3(0.05, 0.30, 0.08); b = vec3(0.20, 0.85, 0.20);
      c = vec3(0.85, 1.00, 0.15); d = vec3(0.40, 1.00, 0.05);
    } else {
      a = vec3(0.20, 0.05, 0.45); b = vec3(0.70, 0.10, 1.00);
      c = vec3(1.00, 0.20, 0.85); d = vec3(1.00, 0.55, 0.85);
    }
  }
  t = fract(t); float s = t * 4.0;
  int idx = int(floor(s)); float f = smoothstep(0.0, 1.0, fract(s));
  vec3 k0, k1;
  if (idx == 0)      { k0 = a; k1 = b; }
  else if (idx == 1) { k0 = b; k1 = c; }
  else if (idx == 2) { k0 = c; k1 = d; }
  else               { k0 = d; k1 = a; }
  return mix(k0, k1, f);
}

float hash11(float p) {
  p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p);
}
float ign(vec2 px) {
  return fract(52.9829189 * fract(dot(px, vec2(0.06711056, 0.00583715))));
}

vec2 cMul(vec2 a, vec2 b) { return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
vec2 cDiv(vec2 a, vec2 b) {
  float d = dot(b, b);
  return vec2(a.x*b.x + a.y*b.y, a.y*b.x - a.x*b.y) / max(d, 1e-12);
}
vec2 cSqr(vec2 z) { return vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y); }

vec3 pickPalette(float t) {
  if (uPalette == ${PAL_WARM}) return paletteWarm(t);
  if (uPalette == ${PAL_COOL}) return paletteCool(t);
  return paletteAcid(t);
}

void updateTrap(inout float trapMin, inout vec2 trapPos, vec2 z, float seedT, float pieceTime) {
  if (uTrapShape == ${T_POINT}) {
    float d = dot(z - uTrapPos, z - uTrapPos);
    if (d < trapMin) { trapMin = d; trapPos = z; }
  } else if (uTrapShape == ${T_CIRCLE}) {
    float d = abs(length(z - uTrapPos) - uTrapRadius);
    if (d*d < trapMin) { trapMin = d*d; trapPos = z; }
  } else if (uTrapShape == ${T_PICKOVER}) {
    float dirSign = (seedT > 0.5) ? 1.0 : -1.0;
    float ang = pieceTime * 0.55 * dirSign + 0.32 * sin(pieceTime * 0.137) + seedT * 6.2832;
    float ca = cos(ang), sa = sin(ang);
    vec2 driftCenter = vec2(
      0.15 * sin(pieceTime * 0.073 + seedT * 6.28),
      0.15 * cos(pieceTime * 0.061 + seedT * 4.71)
    );
    vec2 zs = z - driftCenter;
    vec2 zr = vec2(zs.x * ca + zs.y * sa, -zs.x * sa + zs.y * ca);
    float d = min(abs(zr.x), abs(zr.y));
    if (d*d < trapMin) { trapMin = d*d; trapPos = z; }
  }
}

vec3 newtonRootColor(int rootIdx) {
  float t;
  if (uFractalType == ${F_NEWTON3} || uFractalType == ${F_NOVA}) {
    if (rootIdx == 0)      t = 0.05;
    else if (rootIdx == 1) t = 0.40;
    else                   t = 0.75;
  } else {
    if (rootIdx == 0)      t = 0.05;
    else if (rootIdx == 1) t = 0.30;
    else if (rootIdx == 2) t = 0.55;
    else                   t = 0.80;
  }
  return pickPalette(t);
}

struct NewtonResult { int rootIdx; float iters; float distLast; vec2 z; };
NewtonResult iterateNewton(vec2 z0, float seedT, float pieceTime) {
  vec2 z = z0;
  int rootIdx = -1;
  int N = int(uMaxIter);
  if (N > MAX_ITER_HARD) N = MAX_ITER_HARD;
  int iters = 0;
  float distLast = 1.0;
  float relax = uRelax + 0.07 * sin(pieceTime * 0.7 + seedT * 6.28);
  vec2 lissajousCenter = vec2(
    0.10 * sin(pieceTime * 0.029 + seedT * 6.28),
    0.08 * cos(pieceTime * 0.041 + seedT * 4.71)
  );
  vec2 novaC = (uFractalType == ${F_NOVA})
    ? lissajousCenter + vec2(
        0.30 * cos(pieceTime * 0.200 + seedT * 6.28) + 0.12 * cos(pieceTime * 0.117),
        0.30 * sin(pieceTime * 0.231 + seedT * 6.28) + 0.12 * sin(pieceTime * 0.151)
      )
    : vec2(0.0);
  for (int j = 0; j < MAX_ITER_HARD; j++) {
    if (j >= N) break;
    vec2 prev = z;
    if (uFractalType == ${F_NEWTON3} || uFractalType == ${F_NOVA}) {
      vec2 z2 = cSqr(z);
      vec2 z3 = cMul(z2, z);
      vec2 num = z3 - vec2(1.0, 0.0);
      vec2 den = 3.0 * z2;
      z = z - relax * cDiv(num, den) + novaC;
    } else {
      vec2 z2 = cSqr(z);
      vec2 z4 = cSqr(z2);
      vec2 num = z4 - vec2(1.0, 0.0);
      vec2 den = 4.0 * cMul(z2, z);
      z = z - relax * cDiv(num, den);
    }
    float d = length(z - prev);
    distLast = d;
    iters = j + 1;
    if (d < 1e-4) break;
  }
  if (uFractalType == ${F_NOVA}) {
    float ang = atan(z.y, z.x);
    if (ang < 0.0) ang += 6.2831853;
    ang = mod(ang + 1.0471975, 6.2831853);
    rootIdx = int(floor(ang / 2.0943951));
    if (rootIdx > 2) rootIdx = 2;
  } else {
    vec2 roots3[3];
    roots3[0] = vec2(1.0, 0.0);
    roots3[1] = vec2(-0.5,  0.8660254);
    roots3[2] = vec2(-0.5, -0.8660254);
    vec2 roots4[4];
    roots4[0] = vec2(1.0, 0.0);
    roots4[1] = vec2(0.0, 1.0);
    roots4[2] = vec2(-1.0, 0.0);
    roots4[3] = vec2(0.0, -1.0);
    float bestD = 1e10;
    if (uFractalType == ${F_NEWTON3}) {
      for (int k = 0; k < 3; k++) {
        float dd = length(z - roots3[k]);
        if (dd < bestD) { bestD = dd; rootIdx = k; }
      }
    } else {
      for (int k = 0; k < 4; k++) {
        float dd = length(z - roots4[k]);
        if (dd < bestD) { bestD = dd; rootIdx = k; }
      }
    }
  }
  return NewtonResult(rootIdx, float(iters), distLast, z);
}

struct EscapeResult { vec2 z; vec2 dz; float smoothIter; bool escaped; float trapMin; vec2 trapPos; };
EscapeResult iterateEscape(vec2 z0, vec2 c0, float seedT, float pieceTime) {
  vec2 z = z0;
  vec2 dz = vec2(1.0, 0.0);
  float m2 = dot(z, z);
  float smoothIter = uMaxIter;
  float trapMin = 1e10;
  vec2 trapPos = vec2(0.0);
  bool escaped = false;
  int N = int(uMaxIter);
  if (N > MAX_ITER_HARD) N = MAX_ITER_HARD;
  for (int j = 0; j < MAX_ITER_HARD; j++) {
    if (j >= N) break;
    if (uFractalType == ${F_JULIA} || uFractalType == ${F_MANDELBROT}) {
      dz = 2.0 * cMul(z, dz);
      if (uFractalType == ${F_MANDELBROT}) dz += vec2(1.0, 0.0);
    }
    if (uFractalType == ${F_JULIA}) {
      z = cSqr(z) + c0;
    } else if (uFractalType == ${F_MANDELBROT}) {
      z = cSqr(z) + c0;
    }
    m2 = dot(z, z);
    updateTrap(trapMin, trapPos, z, seedT, pieceTime);
    if (m2 > BAILOUT2) {
      smoothIter = float(j) - log2(log2(m2)) + 4.0;
      escaped = true;
      break;
    }
  }
  return EscapeResult(z, dz, smoothIter, escaped, trapMin, trapPos);
}

vec4 shadeAt(vec2 fc) {
  vec3 coreCol = vec3(0.0);
  float coreAlpha = 0.0;

  for (int i = 0; i < ${MAX_PIECES}; i++) {
    if (i >= uPieceCount) break;
    vec4 A = uPiecesA[i];
    vec4 B = uPiecesB[i];
    vec2 cPos = A.xy;
    float r = A.z;
    float playerTint = B.x;
    float hover = B.y;
    float zoom = B.z;
    float capture = B.w;

    float dist = length(fc - cPos);
    if (dist > r) continue;

    float seed = hash11(uPieceSeedId[i] + 0.137);
    vec2 sphereLocal = (fc - cPos) / r;

    float r2 = dot(sphereLocal, sphereLocal);
    float sphereZ = sqrt(max(1.0 - r2, 1e-4));
    vec2 local = sphereLocal / max(0.5 + 0.5 * sphereZ, 0.01);

    float frozen = uPieceFrozen[i];
    float pieceTime = mix(uTime, seed * 100.0, frozen);
    float effTime = pieceTime;

    float spinDir = (seed > 0.5) ? 1.0 : -1.0;
    float pieceAng = seed * 6.2832 + effTime * (0.04 + 0.06 * seed) * spinDir;
    float pCa = cos(pieceAng), pSa = sin(pieceAng);
    local = vec2(local.x * pCa - local.y * pSa, local.x * pSa + local.y * pCa);

    vec2 z0, c0;
    float seedB = fract(seed * 17.137 + 0.31);
    float pertAng = seedB * 6.2832;
    vec2 pert = vec2(cos(pertAng), sin(pertAng));

    if (uFractalType == ${F_JULIA}) {
      z0 = local * uViewScale * (1.55 / max(zoom, 0.4));
      if (hover > 0.5) {
        float n = max(dot(z0, z0), 0.0008);
        z0 = vec2(z0.x, -z0.y) / n;
      }
      int jIdx = int(floor(seed * 8.0));
      vec2 cBase;
      if (jIdx == 0)      cBase = vec2(-0.700,  0.270);
      else if (jIdx == 1) cBase = vec2(-0.400,  0.600);
      else if (jIdx == 2) cBase = vec2( 0.285,  0.010);
      else if (jIdx == 3) cBase = vec2(-0.835, -0.2321);
      else if (jIdx == 4) cBase = vec2( 0.355,  0.355);
      else if (jIdx == 5) cBase = vec2(-0.512,  0.521);
      else if (jIdx == 6) cBase = vec2( 0.420, -0.220);
      else                cBase = vec2(-1.135,  0.260);
      c0 = cBase + 0.050 * pert;
    } else if (uFractalType == ${F_MANDELBROT}) {
      z0 = vec2(0.0);
      int mIdx = int(floor(seed * 8.0));
      vec2 mCenter; float mScale;
      if (mIdx == 0)      { mCenter = vec2(-0.50,    0.00);    mScale = 1.40;  }
      else if (mIdx == 1) { mCenter = vec2(-0.745,   0.113);   mScale = 0.055; }
      else if (mIdx == 2) { mCenter = vec2( 0.282,   0.012);   mScale = 0.060; }
      else if (mIdx == 3) { mCenter = vec2(-1.40,    0.0);     mScale = 0.32;  }
      else if (mIdx == 4) { mCenter = vec2(-0.16,    1.04);    mScale = 0.32;  }
      else if (mIdx == 5) { mCenter = vec2(-0.7269,  0.1889);  mScale = 0.045; }
      else if (mIdx == 6) { mCenter = vec2(-0.0805,  0.6650);  mScale = 0.080; }
      else                { mCenter = vec2(-1.249,   0.04);    mScale = 0.110; }
      mCenter += pert * mScale * 0.50;
      vec2 zoomedLocal = local * (1.0 / max(zoom, 0.4));
      c0 = mCenter + zoomedLocal * mScale;
    } else {
      z0 = local * uViewScale * (1.6 / max(zoom, 0.4));
      c0 = vec2(0.0);
    }

    vec3 col = vec3(0.0);
    if (uFractalType == ${F_NEWTON3} || uFractalType == ${F_NEWTON4} || uFractalType == ${F_NOVA}) {
      NewtonResult R = iterateNewton(z0, seed, pieceTime);
      vec3 root = newtonRootColor(R.rootIdx);
      col = root;
      float boundary = smoothstep(0.55, 0.85, R.iters / uMaxIter);
      col = mix(col, vec3(0.02), boundary * 0.85);
    } else {
      EscapeResult E = iterateEscape(z0, c0, seed, pieceTime);
      if (uColoring == ${C_BANDS}) {
        float pieceShift = seed * 0.80;
        if (!E.escaped) {
          float interT = fract(0.35 + 0.12 * E.z.x + 0.08 * E.z.y
                              + effTime * 0.04 + pieceShift);
          col = teamPalette(interT, playerTint) * 0.90;
        } else {
          float bandFreq = max(uTrapScale, 0.5);
          float dirSign  = (seed > 0.5) ? 1.0 : -1.0;
          float modIter  = (E.smoothIter + effTime * 2.0 * dirSign + seed * 10.0) / bandFreq;
          float phase    = fract(modIter);
          float fw       = max(fwidth(modIter), 0.005);
          float band     = smoothstep(0.5 - fw, 0.5 + fw, phase);
          float bandIdx  = floor(modIter);
          float drift   = effTime * 0.013 + bandIdx * 0.20 + pieceShift;
          vec3 c1 = teamPalette(fract(drift),         playerTint);
          vec3 c2 = teamPalette(fract(drift + 0.50),  playerTint);
          col = mix(c1, c2, band);
        }
      } else if (uColoring == ${C_PICKOVER}) {
        float t = clamp(sqrt(E.trapMin) * uTrapScale, 0.0, 1.0);
        float fw = max(fwidth(t), 0.005);
        float stalk = smoothstep(0.14 - fw, 0.14 + fw, t);
        float pieceShift = seed * 0.85;
        float colorT = fract(E.smoothIter * 0.045 + effTime * 0.05 + pieceShift);
        vec3 stalkCol = teamPalette(colorT, playerTint);
        vec3 bg      = teamPalette(fract(colorT + 0.55), playerTint) * 0.20;
        col = mix(stalkCol, bg, stalk);
      } else {
        float t = clamp(E.smoothIter / uMaxIter, 0.0, 1.0);
        col = pickPalette(t);
      }
    }

    vec3 normal = vec3(sphereLocal.x, sphereLocal.y, sphereZ);
    vec3 lightDir = normalize(vec3(-0.35, 0.55, 0.85));
    vec3 viewDir  = vec3(0.0, 0.0, 1.0);
    vec3 halfVec  = normalize(lightDir + viewDir);

    float diffuse  = max(dot(normal, lightDir), 0.0);
    float specular = pow(max(dot(normal, halfVec), 0.0), 26.0);
    float rim = pow(1.0 - sphereZ, 2.5);

    vec3 teamSig = teamPalette(0.0, playerTint);

    col *= 0.30 + 0.70 * diffuse;
    col = max(col, teamSig * 0.12);

    if (capture > 0.0) {
      float pulse = 0.5 + 0.5 * sin(capture * 22.0);
      col = mix(col, vec3(1.0, 0.92, 0.75), capture * 0.7 * pulse);
    }

    col += specular * mix(teamSig, vec3(1.0), 0.75) * 0.65;

    float rimMix = rim * (0.45 + 0.65 * diffuse);
    col += rimMix * teamSig * 1.30;

    float discFw = max(fwidth(dist), 0.5);

    coreCol = col;
    coreAlpha = 1.0 - smoothstep(r - discFw, r + discFw, dist);
  }

  return vec4(coreCol, coreAlpha);
}

void main() {
  vec2 fc = vUv * uResolution;
  vec4 col;
  if (uSSAA == 1) {
    vec2 d = vec2(0.25);
    col = (shadeAt(fc + vec2(-d.x, -d.y))
         + shadeAt(fc + vec2( d.x, -d.y))
         + shadeAt(fc + vec2(-d.x,  d.y))
         + shadeAt(fc + vec2( d.x,  d.y))) * 0.25;
  } else if (uSSAA == 2) {
    col = vec4(0.0);
    for (int dy = -1; dy <= 1; dy++) {
      for (int dx = -1; dx <= 1; dx++) {
        vec2 off = vec2(float(dx), float(dy)) * (1.0/3.0);
        col += shadeAt(fc + off);
      }
    }
    col /= 9.0;
  } else {
    col = shadeAt(fc);
  }
  vec3 rgb = col.rgb + (ign(gl_FragCoord.xy) - 0.5) / 255.0;
  gl_FragColor = vec4(rgb * col.a, col.a);
}
